name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Python 3.9 is no longer built for the newest Ubuntu runner, so the oldest
    # supported version runs on Ubuntu 24.04 and the newest on ubuntu-latest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
