<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APIS — Adaptive Protective Immune System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0C0B09;
    --panel:rgba(18,16,12,0.78);
    --gold:#E8A33D;
    --yellow:#F5C518;
    --gold-deep:#B5701C;
    --white:#FFFDF8;
    --muted:#C9BFA9;
    --line:rgba(232,163,61,0.28);
    --good:#8FD19E;
    --bad:#F0685C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--black); color:var(--white); font-family:'IBM Plex Sans', sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
  h1,h2,h3,h4{font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; color:var(--white);}
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 32px;}

  /* ---------- LIVE 3D BACKGROUND ---------- */
  #bg-canvas{position:fixed; inset:0; width:100vw; height:100vh; z-index:0; display:block;}
  .page{position:relative; z-index:1;}

  /* ---------- NAV ---------- */
  nav{position:sticky; top:0; z-index:50; background:rgba(12,11,9,0.72); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  nav .wrap{display:flex; align-items:center; justify-content:space-between; height:64px;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Fraunces', serif; font-weight:600; font-size:20px; color:var(--yellow);}
  .brand .cell{width:16px; height:18px; background:var(--yellow); clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);}
  nav ul{list-style:none; display:flex; gap:32px; font-size:15px;}
  nav ul a{text-decoration:none; color:var(--muted); transition:color .15s;}
  nav ul a:hover{color:var(--yellow);}
  @media(max-width:720px){.navlinks{display:none;}}

  /* ---------- HERO ---------- */
  header.hero{min-height:92vh; display:flex; align-items:center; padding:72px 0 64px;}
  .eyebrow-real{font-size:15px; color:var(--gold); margin-bottom:18px; max-width:560px;}
  h1.title{font-size:58px; line-height:1.04; max-width:760px; margin-bottom:24px; text-shadow:0 2px 24px rgba(0,0,0,0.6);}
  h1.title em{font-style:italic; color:var(--yellow);}
  .lede{font-size:19px; color:var(--muted); max-width:620px; margin-bottom:36px; text-shadow:0 1px 12px rgba(0,0,0,0.7);}
  .cta-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:44px;}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:3px; font-size:15px; font-weight:600; text-decoration:none; transition:transform .15s, box-shadow .15s, background .15s;}
  .btn-primary{background:var(--yellow); color:var(--black);}
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 8px 24px rgba(245,197,24,0.35);}
  .btn-secondary{background:transparent; color:var(--white); border:1.5px solid var(--gold);}
  .btn-secondary:hover{background:var(--gold); color:var(--black);}

  .legend{display:flex; gap:22px; flex-wrap:wrap; font-size:13.5px; color:var(--muted); margin-bottom:28px;}
  .legend span{display:inline-flex; align-items:center; gap:8px;}
  .dot{width:11px; height:11px; border-radius:2px; display:inline-block;}
  .dot.ok{background:var(--yellow); box-shadow:0 0 10px var(--yellow);}
  .dot.bad{background:var(--bad); box-shadow:0 0 10px var(--bad);}
  .dot.bee{width:14px; height:9px; border-radius:50%; background:linear-gradient(90deg, var(--yellow) 0 30%, #111 30% 45%, var(--yellow) 45% 75%, #111 75%);}

  .proof{background:var(--panel); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:6px; padding:28px 32px; max-width:600px;}
  .proof-label{font-size:13px; color:var(--muted); margin-bottom:18px;}
  .proof-grid{display:grid; grid-template-columns:1fr auto 1fr; gap:24px; align-items:center;}
  .proof-col .n{font-family:'Fraunces', serif; font-size:44px; font-weight:600; line-height:1;}
  .proof-col.before .n{color:var(--bad);}
  .proof-col.after .n{color:var(--good);}
  .proof-col .cap{font-size:14px; color:var(--muted); margin-top:6px;}
  .arrow{font-size:28px; color:var(--gold);}
  .proof-foot{margin-top:18px; padding-top:14px; border-top:1px solid var(--line); font-size:14px; color:var(--muted);}
  @media(max-width:640px){
    h1.title{font-size:36px;}
    .proof-grid{grid-template-columns:1fr; text-align:center;}
    .arrow{transform:rotate(90deg);}
  }

  /* ---------- SECTIONS ---------- */
  section{padding:88px 0;}
  .panel{background:var(--panel); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:8px; padding:56px;}
  @media(max-width:700px){.panel{padding:28px 22px;}}
  .sec-head{max-width:640px; margin-bottom:44px;}
  .sec-head h2{font-size:34px; margin-bottom:14px;}
  .sec-head p{color:var(--muted); font-size:17px;}

  .explain-grid{display:grid; grid-template-columns:1fr 1fr; gap:44px;}
  .explain-grid h3{font-size:20px; margin-bottom:10px; color:var(--yellow);}
  .explain-grid p{color:var(--muted); font-size:16px;}
  @media(max-width:800px){.explain-grid{grid-template-columns:1fr;}}

  /* honeycomb layers */
  .comb-grid{display:flex; flex-wrap:wrap; gap:14px;}
  .comb-cell{width:230px; padding:26px 22px 22px; background:rgba(232,163,61,0.10); clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); text-align:center; transition:background .25s, transform .25s;}
  .comb-cell:hover{background:rgba(245,197,24,0.22); transform:translateY(-4px);}
  .comb-cell .num{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--yellow); margin-bottom:8px;}
  .comb-cell h4{font-size:17px; margin-bottom:10px;}
  .comb-cell p{font-size:13.5px; color:var(--muted); line-height:1.5;}
  @media(max-width:700px){.comb-grid{justify-content:center;} .comb-cell{width:80vw; clip-path:none; border-radius:8px; border:1px solid var(--line);}}

  /* results */
  .results-block{margin-bottom:52px;}
  .results-block h3{font-size:22px; margin-bottom:8px; color:var(--yellow);}
  .results-sub{color:var(--muted); font-size:15px; margin-bottom:18px; max-width:640px;}
  table{width:100%; border-collapse:collapse; font-size:15px;}
  th,td{text-align:left; padding:12px 16px; border-bottom:1px solid var(--line);}
  th{font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--gold); font-weight:500; background:rgba(232,163,61,0.08);}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono', monospace;}
  tr:last-child td{font-weight:600; color:var(--yellow);}
  .headline-stat{display:inline-flex; align-items:baseline; gap:6px; border:1px solid var(--line); padding:5px 14px; border-radius:20px; font-size:14px; margin-top:14px; color:var(--muted);}
  .headline-stat .n{font-family:'Fraunces', serif; font-weight:600; color:var(--yellow); font-size:17px;}

  /* hardening */
  .harden-item{display:grid; grid-template-columns:220px 1fr; gap:32px; padding:26px 0; border-top:1px solid var(--line);}
  .harden-item:last-child{border-bottom:1px solid var(--line);}
  .harden-item h4{font-size:18px; margin-bottom:6px;}
  .harden-item .tag{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--yellow); display:block; margin-bottom:10px;}
  .harden-item p{color:var(--muted); font-size:15px;}
  @media(max-width:700px){.harden-item{grid-template-columns:1fr; gap:8px;}}

  .honest-box{border-left:3px solid var(--gold); padding:22px 28px; background:rgba(232,163,61,0.06);}
  .honest-box p{color:var(--muted);}
  .honest-box ul{margin:14px 0 0 20px; color:var(--muted); font-size:15px;}
  .honest-box li{margin-bottom:8px;}

  footer{padding:80px 0 48px; text-align:center;}
  footer h2{font-size:32px; margin-bottom:14px;}
  footer p{color:var(--muted); margin-bottom:30px; max-width:480px; margin-left:auto; margin-right:auto;}
  .foot-links{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:52px;}
  .foot-meta{font-size:13px; color:var(--muted); border-top:1px solid var(--line); padding-top:28px;}

  /* reveal */
  .reveal{opacity:0; transform:translateY(22px); transition:opacity .7s cubic-bezier(.2,.6,.2,1), transform .7s cubic-bezier(.2,.6,.2,1);}
  .reveal.in{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){.reveal{opacity:1; transform:none; transition:none;} .comb-cell{transition:none;}}

  /* ---------- richer content motion ---------- */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .75s cubic-bezier(.2,.65,.2,1),transform .75s cubic-bezier(.2,.65,.2,1)}
  .reveal.in{opacity:1;transform:none}

  /* panels lift in with a subtle scale */
  .panel{transition:transform .9s cubic-bezier(.2,.65,.2,1), box-shadow .5s;}
  .panel.lifted{box-shadow:0 30px 90px rgba(0,0,0,.55)}

  /* honeycomb cards: stagger + hover lift + gold edge sweep */
  .comb-cell{position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.65,.2,1),background .35s,box-shadow .35s}
  .comb-cell:hover{transform:translateY(-6px) scale(1.02);background:rgba(245,197,24,.14);box-shadow:0 14px 36px rgba(0,0,0,.45)}
  .comb-cell::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(245,197,24,.22) 50%,transparent 65%);
    transform:translateX(-120%);transition:transform .8s cubic-bezier(.2,.65,.2,1)}
  .comb-cell:hover::after{transform:translateX(120%)}
  .comb-cell .num{transition:color .3s,letter-spacing .3s}
  .comb-cell:hover .num{color:var(--white);letter-spacing:.2em}

  /* table rows cascade in */
  tbody tr{opacity:0;transform:translateX(-14px);transition:opacity .5s ease,transform .5s ease}
  tbody tr.in{opacity:1;transform:none}
  tbody tr:hover td{background:rgba(245,197,24,.07)}
  td,th{transition:background .25s}

  /* animated bar under each false-positive figure */
  .bar{position:relative;height:3px;background:rgba(232,163,61,.18);margin-top:.45rem;overflow:hidden;border-radius:2px}
  .bar i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,var(--gold-deep),var(--yellow));
         transition:right 1.4s cubic-bezier(.2,.65,.2,1)}

  /* headline stat: counts up and glows */
  .headline-stat{transition:transform .5s,box-shadow .5s}
  .headline-stat.pop{transform:scale(1.04);box-shadow:0 0 30px rgba(245,197,24,.22)}

  /* hardening rows slide in from alternating sides */
  .harden-item{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.2,.65,.2,1),transform .7s cubic-bezier(.2,.65,.2,1)}
  .harden-item.in{opacity:1;transform:none}
  .harden-item:hover .tag{color:var(--white)}
  .harden-item .tag{transition:color .3s}

  /* limits list ticks in one by one */
  .honest-box li{opacity:0;transform:translateX(-10px);transition:opacity .5s,transform .5s}
  .honest-box li.in{opacity:1;transform:none}

  /* hero proof numbers count up */
  .proof-col .n{font-variant-numeric:tabular-nums}

  /* section headings get a drawn underline */
  .sec-head h2{position:relative;display:inline-block;padding-bottom:.35rem}
  .sec-head h2::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;
    background:linear-gradient(90deg,var(--yellow),transparent);transition:width 1s cubic-bezier(.2,.65,.2,1) .2s}
  .sec-head.in h2::after{width:100%}

  /* nav link underline */
  .navlinks a{position:relative}
  .navlinks a::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--yellow);transition:width .3s}
  .navlinks a:hover::after{width:100%}

  /* scroll progress */
  .progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;
            background:linear-gradient(90deg,var(--gold-deep),var(--yellow));transition:width .1s linear}

  @media (prefers-reduced-motion:reduce){
    .reveal,.harden-item,.honest-box li,tbody tr{opacity:1!important;transform:none!important;transition:none!important}
    .comb-cell,.comb-cell::after,.sec-head h2::after{transition:none!important}
  }

</style>
</head>
<body>

<div class="progress" id="progress"></div>

<div class="page">
<nav><div class="wrap">

  <ul class="navlinks" id="navlinks"></ul>
</div></nav>

</div>

    <div class="wrap">
      <p class="eyebrow-real reveal">${H.eyebrow}</p>
      <h1 class="title reveal">${H.title}</h1>
      <p class="lede reveal">${H.lede}</p>
      <div class="cta-row reveal">${H.ctas.map(c=>`<a href="${c.href}" class="btn ${c.primary?'btn-primary':'btn-secondary'}">${c.label}</a>`).join('')}</div>
      <div class="legend reveal">${H.legend.map(l=>`<span><i class="dot ${l.cls}"></i> ${l.text}</span>`).join('')}</div>
      <div class="proof reveal">
        <p class="proof-label">${H.proof.label}</p>
        <div class="proof-grid">
          <div class="proof-col before"><div class="n" data-count="${H.proof.before.num}">0</div><div class="cap">${H.proof.before.caption}</div></div>
          <div class="arrow">\u2192</div>
          <div class="proof-col after"><div class="n" data-count="${H.proof.after.num}">0</div><div class="cap">${H.proof.after.caption}</div></div>
        </div>
        <div class="proof-foot">${H.proof.foot}</div>
      </div>
    </div>
  </header>`;

  const W = SITE.what;
  const what = `
  <section id="what"><div class="wrap"><div class="panel">
    <div class="sec-head reveal"><h2>${W.title}</h2><p>${W.intro}</p></div>
    <div class="explain-grid">
      ${W.items.map(i=>`<div class="reveal"><h3>${i.h}</h3><p>${i.p}</p></div>`).join('')}
    </div>
  </div></div></section>`;

  const A = SITE.architecture;
  const arch = `
  <section id="architecture"><div class="wrap"><div class="panel">
    <div class="sec-head reveal"><h2>${A.title}</h2><p>${A.intro}</p></div>
    <div class="comb-grid">
      ${A.layers.map(l=>`<div class="comb-cell reveal"><div class="num">${l.num}</div><h4>${l.name}</h4><p>${l.p}</p></div>`).join('')}
    </div>
  </div></div></section>`;

  const R = SITE.results;
  const results = `
  <section id="results"><div class="wrap"><div class="panel">
    <div class="sec-head reveal"><h2>${R.title}</h2><p>${R.intro}</p></div>
    ${R.blocks.map(b=>`
      <div class="results-block reveal">
        <h3>${b.title}</h3>
        <p class="results-sub">${b.sub}</p>
        <table>
          <thead><tr>${b.cols.map((c,i)=>`<th class="${i?'num':''}">${c}</th>`).join('')}</tr></thead>
          <tbody>${b.rows.map((row,ri)=>`<tr>${row.map((cell,ci)=>{
            const bar = (ci===1 && b.bars) ? `<div class="bar"><i data-w="${Math.round(b.bars[ri]*100)}"></i></div>` : '';
            return `<td class="${ci?'num':''}">${cell}${bar}</td>`;
          }).join('')}</tr>`).join('')}</tbody>
        </table>
        <div class="headline-stat"><span class="n">${b.stat.value}</span> ${b.stat.label}</div>
      </div>`).join('')}
  </div></div></section>`;

  const Hd = SITE.hardening;
  const hardening = `
  <section id="hardening"><div class="wrap"><div class="panel">
    <div class="sec-head reveal"><h2>${Hd.title}</h2><p>${Hd.intro}</p></div>
    <div class="harden-list">
      ${Hd.items.map(i=>`<div class="harden-item"><div><span class="tag">${i.tag}</span><h4>${i.h}</h4></div><p>${i.p}</p></div>`).join('')}
    </div>
  </div></div></section>`;

  const O = SITE.honest;
  const honest = `
  <section id="honest"><div class="wrap"><div class="panel">
    <div class="sec-head reveal"><h2>${O.title}</h2><p>${O.intro}</p></div>
    <div class="honest-box reveal">
      <p>${O.lead}</p>
      <ul>${O.items.map(i=>`<li>${i}</li>`).join('')}</ul>
    </div>
  </div></div></section>`;

  const F = SITE.footer;
  const footer = `
  <footer><div class="wrap">
    <h2 class="reveal">${F.title}</h2>
    <p class="reveal">${F.body}</p>
    <div class="foot-links reveal">${F.links.map(l=>`<a href="${l.href}" class="btn ${l.primary?'btn-primary':'btn-secondary'}">${l.label}</a>`).join('')}</div>
    <div class="foot-meta">${F.meta}</div>
  </div></footer>`;

  document.getElementById('app').innerHTML = hero + what + arch + results + hardening + honest + footer;
})();

/* =====================================================================
   CONTENT MOTION — reveals, staggers, counters, bars, progress
   ===================================================================== */
(function motion(){
  const REDUCED = matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* scroll progress bar */
  const bar = document.getElementById('progress');
  function prog(){
    const h = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (h > 0 ? Math.min(100, (scrollY/h)*100) : 0) + '%';
  }
  addEventListener('scroll', prog, {passive:true}); prog();

  if (REDUCED) {
    document.querySelectorAll('.reveal,.harden-item,tbody tr,.honest-box li').forEach(e=>e.classList.add('in'));
    document.querySelectorAll('[data-count]').forEach(e=>e.textContent = Number(e.dataset.count).toLocaleString());
    document.querySelectorAll('.bar i').forEach(e=>e.style.right = (100 - e.dataset.w) + '%');
    return;
  }

  /* number count-up, eased */
  function countUp(el){
    const target = Number(el.dataset.count), dur = 1500, t0 = performance.now();
    (function tick(now){
      const k = Math.min((now - t0)/dur, 1);
      const eased = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(target*eased).toLocaleString();
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  }

  /* generic staggered reveal */
  const seen = new Map();
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target;
      const delay = (parseInt(el.dataset.i || 0)) * 80;
      setTimeout(() => {
        el.classList.add('in');
        if (el.classList.contains('panel')) el.classList.add('lifted');
        el.querySelectorAll('[data-count]').forEach(countUp);
        el.querySelectorAll('.bar i').forEach((b, i) =>
          setTimeout(() => b.style.right = (100 - b.dataset.w) + '%', 220 + i*110));
        el.querySelectorAll('tbody tr').forEach((tr, i) =>
          setTimeout(() => tr.classList.add('in'), 120 + i*90));
        el.querySelectorAll('.honest-box li, ul li').forEach((li, i) =>
          setTimeout(() => li.classList.add('in'), 160 + i*110));
        const stat = el.querySelector('.headline-stat');
        if (stat) setTimeout(() => {
          stat.classList.add('pop');
          setTimeout(() => stat.classList.remove('pop'), 420);
        }, 700);
      }, delay);
      io.unobserve(el);
    });
  }, {threshold:0.12, rootMargin:'0px 0px -60px 0px'});

  document.querySelectorAll('.reveal, .harden-item').forEach(el => {
    const parent = el.parentElement, n = seen.get(parent) || 0;
    el.dataset.i = n; seen.set(parent, n + 1);
    io.observe(el);
  });

  /* hero fires immediately */
  setTimeout(() => {
    document.querySelectorAll('.hero .reveal').forEach((el, i) =>
      setTimeout(() => {
        el.classList.add('in');
        el.querySelectorAll('[data-count]').forEach(countUp);
      }, i*110));
  }, 120);
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var canvas = document.getElementById('bg-canvas');
  if(!canvas || !window.THREE) return;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0c0b09, 0.04);
  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  camera.position.set(0, 1.0, 13);

  var GOLD=0xE8A33D, YELLOW=0xF5C518, DEEP=0xB5701C, BLACK=0x111009, WHITE=0xFFFDF8, RED=0xE0453A;

  function size(){
    var w=window.innerWidth, h=window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }

  // ---- lights ----
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  var key = new THREE.DirectionalLight(0xfff1d6, 1.0); key.position.set(5, 8, 6); scene.add(key);
  var rim = new THREE.DirectionalLight(DEEP, 0.6); rim.position.set(-6, -2, -4); scene.add(rim);
  var hiveGlow = new THREE.PointLight(YELLOW, 1.2, 12); hiveGlow.position.set(2.2, 0.2, 1.5); scene.add(hiveGlow);

  // ---- "coding area": digital floor grid + drifting code specks + far wireframe hexes ----
  var grid = new THREE.GridHelper(60, 40, 0x6b4d14, 0x2a2010);
  grid.position.y = -4.2; grid.material.transparent = true; grid.material.opacity = 0.35; scene.add(grid);

  var N = reduced ? 200 : 600;
  var pos = new Float32Array(N*3), speeds = new Float32Array(N);
  for(var i=0;i<N;i++){ pos[i*3]=(Math.random()-0.5)*40; pos[i*3+1]=(Math.random()-0.5)*22; pos[i*3+2]=-4-Math.random()*20; speeds[i]=0.15+Math.random()*0.5; }
  var pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var specks = new THREE.Points(pGeo, new THREE.PointsMaterial({color:GOLD, size:0.07, transparent:true, opacity:0.55}));
  scene.add(specks);

  var farHexGeo = new THREE.CylinderGeometry(3, 3, 0.05, 6), farHexes=[];
  for(var k=0;k<4;k++){
    var fm = new THREE.Mesh(farHexGeo, new THREE.MeshBasicMaterial({color:DEEP, wireframe:true, transparent:true, opacity:0.12}));
    fm.rotation.x = Math.PI/2; fm.position.set((Math.random()-0.5)*24, (Math.random()-0.5)*10, -12-Math.random()*8);
    fm.userData.spin = (Math.random()-0.5)*0.15; scene.add(fm); farHexes.push(fm);
  }

  // ---- the hive ----
  var hive = new THREE.Group(); hive.position.set(2.4, 0.2, 0); scene.add(hive);
  var cellGeo = new THREE.CylinderGeometry(0.62, 0.62, 0.5, 6);
  var cells=[], hiveCols=5, hiveRows=4, sx=1.12, sy=0.98;
  var entrance = new THREE.Vector3();
  for(var r=0;r<hiveRows;r++){ for(var c=0;c<hiveCols;c++){
    var x=(c-(hiveCols-1)/2)*sx + (r%2 ? sx/2 : 0), y=(r-(hiveRows-1)/2)*sy;
    if(r===1 && c===0){ entrance.set(x, y, 0.5); continue; }   // the open entrance cell
    var lit = Math.random() < 0.35;
    var cm = new THREE.MeshStandardMaterial({color: lit?YELLOW:GOLD, emissive: lit?YELLOW:0x000000, emissiveIntensity: lit?0.35:0, metalness:0.2, roughness:0.5});
    var cell = new THREE.Mesh(cellGeo, cm); cell.rotation.x = Math.PI/2; cell.position.set(x, y, 0);
    cell.userData.lit = lit; cell.userData.phase = Math.random()*6.28; cell.userData.pulse = 0;
    hive.add(cell); cells.push(cell);
  }}
  var entranceWorld = new THREE.Vector3();
  function updEntrance(){ hive.updateMatrixWorld(); entranceWorld.copy(entrance); hive.localToWorld(entranceWorld); }
  updEntrance();

  // ---- bee factory ----
  var bodyGeo = new THREE.SphereGeometry(0.5, 18, 14), headGeo = new THREE.SphereGeometry(0.27, 14, 12);
  var stingGeo = new THREE.ConeGeometry(0.1, 0.3, 10), wingGeo = new THREE.PlaneGeometry(0.42, 0.95);
  var goldMat = new THREE.MeshStandardMaterial({color:YELLOW, metalness:0.1, roughness:0.45});
  var blackMat = new THREE.MeshStandardMaterial({color:BLACK, metalness:0.2, roughness:0.6});
  var wingMat = new THREE.MeshStandardMaterial({color:WHITE, transparent:true, opacity:0.45, side:THREE.DoubleSide, roughness:0.2});
  function makeBee(scale){
    var g = new THREE.Group();
    var body = new THREE.Mesh(bodyGeo, goldMat); body.scale.set(1.6, 1, 1); g.add(body);
    [[-0.2,0.49],[0.1,0.5],[0.4,0.44]].forEach(function(b){
      var band = new THREE.Mesh(new THREE.CylinderGeometry(b[1], b[1], 0.13, 18), blackMat);
      band.rotation.z = Math.PI/2; band.position.x = b[0]; g.add(band);
    });
    var head = new THREE.Mesh(headGeo, blackMat); head.position.x = 0.88; g.add(head);
    var sting = new THREE.Mesh(stingGeo, blackMat); sting.rotation.z = Math.PI/2; sting.position.x = -0.9; g.add(sting);
    var wl = new THREE.Group(); wl.position.set(0.05, 0.38, 0.12);
    var wlm = new THREE.Mesh(wingGeo, wingMat); wlm.position.set(0, 0, 0.45); wlm.rotation.x = -Math.PI/2; wl.add(wlm); g.add(wl);
    var wr = new THREE.Group(); wr.position.set(0.05, 0.38, -0.12);
    var wrm = new THREE.Mesh(wingGeo, wingMat); wrm.position.set(0, 0, -0.45); wrm.rotation.x = -Math.PI/2; wr.add(wrm); g.add(wr);
    g.userData.wings = [wl, wr]; g.rotation.order = 'YZX'; g.scale.setScalar(scale || 0.55);
    return g;
  }

  // ---- worker bees orbiting the hive ----
  var bees=[], beeCount = reduced ? 3 : 6;
  for(var i=0;i<beeCount;i++){
    var b = makeBee(0.5 + Math.random()*0.15);
    b.userData.orbit = {rx:4.5+Math.random()*2.5, rz:2.2+Math.random()*1.5, ry:0.8+Math.random()*1.2, speed:0.25+Math.random()*0.25, phase:Math.random()*6.28, cx:0.8, cy:0.6};
    scene.add(b); bees.push(b);
  }
  // ---- the guard bee at the entrance ----
  var guard = makeBee(0.62); scene.add(guard);
  var guardHome = entranceWorld.clone().add(new THREE.Vector3(-1.4, 0.3, 0.9));
  guard.position.copy(guardHome); guard.rotation.y = Math.PI;

  // ---- traffic packets flowing toward the hive ----
  var pktGeo = new THREE.BoxGeometry(0.24, 0.24, 0.24), packets=[], pktCount = reduced ? 12 : 26;
  function spawn(p){
    p.position.set(-11-Math.random()*4, (Math.random()-0.5)*5, (Math.random()-0.5)*4);
    p.userData.bad = Math.random() < 0.28;
    p.material.color.setHex(p.userData.bad ? RED : YELLOW); p.material.emissive.setHex(p.userData.bad ? RED : YELLOW);
    p.material.opacity = 1; p.scale.setScalar(1); p.userData.state = 'fly'; p.userData.t = 0;
    p.userData.speed = 1.6 + Math.random()*1.2;
    p.userData.spin = new THREE.Vector3(Math.random(), Math.random(), Math.random()).multiplyScalar(2);
  }
  for(var i=0;i<pktCount;i++){
    var pm = new THREE.MeshStandardMaterial({color:YELLOW, emissive:YELLOW, emissiveIntensity:0.5, transparent:true, opacity:1, metalness:0.3, roughness:0.4});
    var p = new THREE.Mesh(pktGeo, pm); spawn(p); p.position.x = -11 + Math.random()*10; scene.add(p); packets.push(p);
  }

  // ---- interception flash ----
  var flashes=[], flashGeo = new THREE.SphereGeometry(0.3, 12, 10);
  function flash(at){
    var m = new THREE.Mesh(flashGeo, new THREE.MeshBasicMaterial({color:RED, transparent:true, opacity:0.8}));
    m.position.copy(at); m.userData.t = 0; scene.add(m); flashes.push(m);
  }
  function updFlashes(dt){
    for(var i=flashes.length-1;i>=0;i--){
      var f=flashes[i]; f.userData.t += dt; f.scale.setScalar(1 + f.userData.t*4);
      f.material.opacity = Math.max(0, 0.8 - f.userData.t*1.6);
      if(f.userData.t > 0.5){ scene.remove(f); f.material.dispose(); flashes.splice(i,1); }
    }
  }
  function pulseCell(){ var c = cells[Math.floor(Math.random()*cells.length)]; c.material.emissive.setHex(YELLOW); c.userData.pulse = 1; }
  function updCells(dt, t){
    cells.forEach(function(c){
      if(c.userData.pulse > 0) c.userData.pulse = Math.max(0, c.userData.pulse - dt*1.2);
      var base = c.userData.lit ? 0.3 + Math.sin(t*1.5 + c.userData.phase)*0.12 : 0;
      c.material.emissiveIntensity = base + c.userData.pulse*0.9;
      if(!c.userData.lit && c.userData.pulse <= 0) c.material.emissive.setHex(0x000000);
    });
  }

  var tmp = new THREE.Vector3(), next = new THREE.Vector3();
  function updPackets(dt, t){
    packets.forEach(function(p){
      var u = p.userData;
      p.rotation.x += u.spin.x*dt; p.rotation.y += u.spin.y*dt;
      if(u.state === 'fly'){
        tmp.subVectors(entranceWorld, p.position); var d = tmp.length();
        tmp.normalize().multiplyScalar(u.speed*dt); p.position.add(tmp);
        p.position.y += Math.sin(t*2 + p.position.x)*0.004;
        if(d < 1.9 && u.bad){
          u.state = 'deflect'; u.t = 0;
          u.vel = new THREE.Vector3(-2.5-Math.random(), 1.5+Math.random(), (Math.random()-0.5)*2);
          guard.userData.lunge = {target: p.position.clone(), t: 0};
          flash(p.position);
        } else if(d < 0.35){ u.state = 'enter'; u.t = 0; pulseCell(); }
      } else if(u.state === 'deflect'){
        u.t += dt; p.position.addScaledVector(u.vel, dt); u.vel.y -= 2.5*dt;
        p.material.opacity = Math.max(0, 1 - u.t/1.3); if(u.t > 1.3) spawn(p);
      } else if(u.state === 'enter'){
        u.t += dt; var s = Math.max(0, 1 - u.t/0.45);
        p.scale.setScalar(s); p.material.opacity = s; p.position.z -= dt*1.5; if(u.t > 0.45) spawn(p);
      }
    });
  }

  function beePos(o, a, out){ out.set(o.cx + Math.cos(a)*o.rx, o.cy + Math.sin(a*1.7)*o.ry, Math.sin(a)*o.rz); }
  function orient(b, target){
    tmp.subVectors(target, b.position);
    var yaw = Math.atan2(-tmp.z, tmp.x), h = Math.sqrt(tmp.x*tmp.x + tmp.z*tmp.z), pitch = Math.atan2(tmp.y, h);
    b.rotation.set(0, yaw, pitch);
  }
  function flap(b, t){
    var w = b.userData.wings, f = reduced ? Math.sin(t*6)*0.3 : Math.sin(t*42 + b.position.x)*0.75;
    w[0].rotation.x = f; w[1].rotation.x = -f;
  }
  function updBees(dt, t){
    bees.forEach(function(b){
      var o = b.userData.orbit, a = t*o.speed + o.phase;
      beePos(o, a, b.position); beePos(o, a+0.05, next); orient(b, next); flap(b, t);
    });
    var L = guard.userData.lunge;
    if(L){
      L.t += dt; var kk = Math.sin(Math.min(L.t/0.6, 1)*Math.PI);
      tmp.lerpVectors(guardHome, L.target, kk*0.8); guard.position.copy(tmp);
      orient(guard, L.target); if(L.t > 0.6) guard.userData.lunge = null;
    } else {
      guard.position.set(guardHome.x + Math.sin(t*1.3)*0.15, guardHome.y + Math.sin(t*2.1)*0.12, guardHome.z + Math.cos(t*1.1)*0.1);
      guard.rotation.set(0, Math.PI, Math.sin(t*1.5)*0.08);
    }
    flap(guard, t);
  }
  function updSpecks(dt){
    var arr = pGeo.attributes.position.array;
    for(var i=0;i<N;i++){ arr[i*3+1] += speeds[i]*dt*0.4; if(arr[i*3+1] > 11) arr[i*3+1] = -11; }
    pGeo.attributes.position.needsUpdate = true;
  }

  var mx=0, my=0;
  window.addEventListener('mousemove', function(e){ mx = e.clientX/window.innerWidth - 0.5; my = e.clientY/window.innerHeight - 0.5; });
  var clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    var sy = window.scrollY || 0;
    camera.position.x += (mx*1.6 - camera.position.x)*0.04;
    camera.position.y += (1.0 - my*1.0 - camera.position.y)*0.04;
    camera.position.z = 13 + Math.min(sy, 1500)*0.0015;
    camera.lookAt(0.8, 0.2, 0);
    hive.rotation.y = Math.sin(t*0.3)*0.12; updEntrance();
    hiveGlow.intensity = 1.1 + Math.sin(t*2)*0.25;
    farHexes.forEach(function(m){ m.rotation.z += m.userData.spin*dt; });
    updSpecks(dt); updCells(dt, t); updPackets(dt, t); updBees(dt, t); updFlashes(dt);
    renderer.render(scene, camera);
  }
  size(); window.addEventListener('resize', size); animate();
})();

// ---- scroll-triggered reveal ----
(function(){
  var items = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ items.forEach(function(el){ el.classList.add('in'); }); return; }
  var seen = new Map();
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        var el = entry.target, delay = (parseInt(el.dataset.i || 0))*60;
        setTimeout(function(){ el.classList.add('in'); }, delay);
        observer.unobserve(el);
      }
    });
  }, {threshold:0.15, rootMargin:'0px 0px -60px 0px'});
  items.forEach(function(el){
    var parent = el.parentElement, count = seen.get(parent) || 0;
    el.dataset.i = count; seen.set(parent, count+1); observer.observe(el);
  });
})();
</script>
